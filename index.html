<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b66"><title>Spese Trasferta</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=11"></head><body><main class="app"><section id="login" class="card login"><small>Spese di trasferta</small><h1>Accesso</h1><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signIn" class="primary">Accedi</button><p id="loginMsg" class="msg"></p></section><section id="main" class="hidden"><header><div><small>Spese di trasferta</small><h1 id="monthTitle"></h1></div><div class="nav"><button id="prev">‹</button><button id="today">Oggi</button><button id="next">›</button><button id="summary" type="button">Riepilogo mese</button><button id="logout">Esci</button></div></header><div id="sync" class="sync">Connessione…</div><div class="week"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div><section id="calendar" class="calendar"></section><section class="card daycard"><h2 id="dayTitle"></h2><label>Commessa<input id="job"></label><label>Note<textarea id="notes" rows="3"></textarea></label><button id="add" class="primary">+ Aggiungi spesa</button><div id="form" class="expense-form hidden"><label>Tipologia<select id="type"><option>Ricarica</option><option>Pranzo trasferta</option><option>Pranzo clienti</option><option>Taxi</option><option>Parcheggio</option><option>Metro</option><option>Albergo</option><option>Altro</option></select></label><label>Importo €<input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal"></label><label class="check"><input id="private" type="checkbox"> Carta privata</label><div class="receipts"><strong>Giustificativi locali</strong><div class="receipt-actions"><button id="btnCamera" type="button">📷 Scatta foto</button><button id="btnPhoto" type="button">🖼️ Scegli foto</button><button id="btnFile" type="button">📎 Allega file/PDF</button></div><input id="camera" class="file" type="file" accept="image/*" capture="environment"><input id="photo" class="file" type="file" accept="image/*" multiple><input id="file" class="file" type="file" accept="application/pdf,image/*" multiple><div id="receiptList" class="hint">Nessun allegato</div></div><div class="form-actions"><button id="save" class="primary">Salva spesa</button><button id="cancelEdit" type="button" class="hidden">Annulla</button></div><p id="formMsg" class="msg"></p></div><div id="expenses"></div><div class="totals"><div><span>Carta privata</span><strong id="privTotal">€ 0,00</strong></div><div><span>Carta aziendale</span><strong id="corpTotal">€ 0,00</strong></div><div class="grand"><span>Totale</span><strong id="total">€ 0,00</strong></div></div></section></section></main><div id="monthly" class="preview hidden"><div class="preview-card summary-card"><div class="preview-head"><h2>Riepilogo mensile</h2><button id="closeMonthly" type="button">×</button></div><div id="monthlyBody"></div><div class="summary-actions"><button id="printMonthly" type="button">Stampa riepilogo</button><button id="pdfWithReceipts" type="button" class="primary">PDF con giustificativi</button></div></div></div><div id="preview" class="preview hidden"><div class="preview-card"><div class="preview-head"><h2 id="previewTitle">Giustificativi</h2><button id="closePreview" type="button">×</button></div><div id="previewBody"></div></div></div><script type="module" src="app.js?v=11"></script></body></html>
