<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b66"><title>Spese Trasferta</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><small>Spese di trasferta</small><h1 id="monthTitle"></h1></div><div class="nav"><button id="prev" type="button">‹</button><button id="today" type="button">Oggi</button><button id="next" type="button">›</button></div></header><div class="week"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div><section id="calendar" class="calendar"></section><section class="daycard"><h2 id="dayTitle"></h2><label>Commessa<input id="job"></label><label>Note<textarea id="notes" rows="3"></textarea></label><button id="add" type="button" class="primary">+ Aggiungi spesa</button><div id="form" class="expense-form hidden"><label>Tipologia<select id="type"><option>Ricarica</option><option>Pranzo trasferta</option><option>Pranzo clienti</option><option>Taxi</option><option>Parcheggio</option><option>Metro</option><option>Albergo</option><option>Altro</option></select></label><label>Importo €<input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal"></label><label class="check"><input id="private" type="checkbox"> Carta privata</label><section class="receipts"><div class="receipt-title">Giustificativi</div><div class="receipt-actions"><button id="btnCamera" type="button" class="attach-btn">📷 Scatta foto</button><button id="btnPhoto" type="button" class="attach-btn">🖼️ Scegli foto</button><button id="btnFile" type="button" class="attach-btn">📎 Allega file/PDF</button></div><input id="receiptCamera" class="hidden-file" type="file" accept="image/*" capture="environment"><input id="receiptPhoto" class="hidden-file" type="file" accept="image/*" multiple><input id="receiptFile" class="hidden-file" type="file" accept="application/pdf,image/*" multiple><div id="receiptList" class="receipt-list" aria-live="polite">Nessun giustificativo selezionato</div></section><button id="save" type="button" class="primary">Salva spesa</button><p id="msg"></p></div><div id="expenses"></div><div class="totals"><div><span>Carta privata</span><strong id="privTotal">€ 0,00</strong></div><div><span>Carta aziendale</span><strong id="corpTotal">€ 0,00</strong></div><div class="grand"><span>Totale</span><strong id="total">€ 0,00</strong></div></div></section></main><script src="app.js?v=3"></script></body></html>
